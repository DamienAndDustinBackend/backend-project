services:
  postgres:
    build: .
    image: postgres
    container_name: backend-project-postgres-container
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    image: backend-project
    container_name: backend-project-container
    environment:
      ENVIRONMENT: "DEV"
      DSN: "postgresql://postgres:password@postgres:5432/postgres"
    ports:
      - "8080:8080"
